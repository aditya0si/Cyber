name: CyberSim CI

on:
  push:
    branches: [main, release/*]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-fast:
    name: lint + type + unit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.16"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install deps
        run: uv sync --all-extras --dev

      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: MyPy
        run: uv run mypy cybersim
      - name: Pytest (unit)
        run: uv run pytest -q -m "not integration and not slow"

  security-scan:
    name: secrets + deps audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web-build:
    name: web typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - name: Typecheck
        run: pnpm typecheck
        working-directory: apps/web
      - name: Lint
        run: pnpm lint
        working-directory: apps/web
      - name: Build
        run: pnpm build
        working-directory: apps/web
