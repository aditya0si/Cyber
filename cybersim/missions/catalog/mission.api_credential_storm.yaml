id: mission.api_credential_storm
title: "Mission: API Credential Storm"
subtitle: "Public API · auth endpoint under credential stuffing"
simulator: api
scenario_id: api.brute_force
duration_sec: 300
objectives:
  - id: spot_brute
    title: "Detect the brute-force burst"
    kind: detection_within
    params: { threat_class: credential_brute_force, severity: medium, within_sec: 90 }
    points: 40
  - id: block_source
    title: "Block the source IP before it escalates"
    kind: action_executed_before_event
    params:
      action_ids: [block_source_ip, rate_limit_route]
      stop_event_subtype: unsanitized_auth_failure_burst
    points: 40
  - id: protect_api
    title: "Protect the API with a rate limit"
    kind: action_executed_before_event
    params:
      action_ids: [rate_limit_route]
      stop_event_subtype: api_rate_window
    points: 20
scoring:
  max_score: 100
sharing:
  public_default: true
status: active