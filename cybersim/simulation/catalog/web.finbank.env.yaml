id: web.finbank
assets:
  - id: lb1
    type: load_balancer
    label: "Load Balancer"
    attrs: { vip: 198.51.100.10, tls: true }
  - id: web1
    type: web_server
    label: "Web Server"
    attrs: { os: ubuntu2204, framework: flask, sqli_vulnerable: true }
  - id: api1
    type: api_server
    label: "API Server"
    attrs: { os: ubuntu2204, framework: fastapi }
  - id: auth_svc
    type: auth_service
    label: "Auth Service"
    attrs: { framework: flask }
  - id: users_db
    type: database
    label: "User Database"
    attrs: { engine: postgres, port: 5432 }
services:
  - id: login_ep
    asset: web1
    kind: http
    endpoint: /api/login
    attrs: { auth_required: false, rate_limit_per_min: 60, sqli_vulnerable: true }
  - id: orders_api
    asset: api1
    kind: http
    endpoint: /api/orders/{id}
    attrs: { auth_required: true }
  - id: auth_check
    asset: auth_svc
    kind: http
    endpoint: /api/auth/verify
    attrs: { auth_required: false }
edges:
  - from: lb1
    type: EXPOSES
    to: login_ep
    attrs: { proto: https }
  - from: lb1
    type: EXPOSES
    to: orders_api
    attrs: { proto: https }
  - from: web1
    type: READS
    to: users_db
    attrs: { priv: r }
  - from: auth_svc
    type: READS
    to: users_db
    attrs: { priv: r }
  - from: api1
    type: AUTHENTICATES_WITH
    to: auth_check
    attrs: { strength: jwt }
credentials:
  - id: admin_creds
    owner: auth_svc
    attrs: { strength: weak, mfa: false, scope: ["admin"] }
  - id: alice_creds
    owner: auth_svc
    attrs: { strength: strong, mfa: true, scope: ["user"] }
data:
  - id: user_data
    store: users_db
    attrs: { kind: pii, sensitivity: high }
  - id: order_data
    store: users_db
    attrs: { kind: financial, sensitivity: high }
