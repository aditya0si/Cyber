id: supply.app
assets:
  - id: app_build
    type: worker
    label: "Application Build Container"
    attrs: { os: debian, framework: node }
  - id: app_server
    type: web_server
    label: "Production App"
    attrs: { os: ubuntu2204, framework: node }
  - id: pkg_registry
    type: package_registry
    label: "Package Registry"
    attrs: { registry: registry.npmjs.org }
  - id: c2_sink
    type: workstation
    label: "External Sink"
    attrs: { ip: 198.51.100.77 }
services: []
edges:
  - from: app_build
    type: FETCHES_FROM
    to: pkg_registry
    attrs: { proto: https }
  - from: app_build
    type: DEPENDS_ON
    to: app_server
    attrs: {}
  - from: app_server
    type: STORES
    to: app_data
credentials: []
data:
  - id: app_data
    store: app_server
    attrs: { kind: secrets, sensitivity: high }
