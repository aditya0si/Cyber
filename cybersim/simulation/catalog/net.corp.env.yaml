id: net.corp
assets:
  - id: 10.0.0.5
    type: workstation
    label: "Bastion Host"
    attrs: { os: ubuntu2204, ssh: true }
  - id: 10.0.0.15
    type: workstation
    label: "Jump Host"
    attrs: { os: ubuntu2204, ssh: true }
  - id: 10.0.0.25
    type: database
    label: "App DB"
    attrs: { engine: postgres, host: 10.0.0.25 }
  - id: 10.0.0.35
    type: database
    label: "Data Warehouse"
    attrs: { engine: postgres, host: 10.0.0.35 }
services:
  - id: ssh_5
    asset: 10.0.0.5
    kind: ssh
    endpoint: ssh://10.0.0.5:22
    attrs: { auth_required: true }
  - id: ssh_15
    asset: 10.0.0.15
    kind: ssh
    endpoint: ssh://10.0.0.15:22
    attrs: { auth_required: true }
edges:
  - from: 10.0.0.5
    type: CONNECTS_TO
    to: 10.0.0.15
    attrs: { proto: tcp, port: 22 }
  - from: 10.0.0.15
    type: CONNECTS_TO
    to: 10.0.0.25
    attrs: { proto: tcp, port: 5432 }
  - from: 10.0.0.15
    type: CONNECTS_TO
    to: 10.0.0.35
    attrs: { proto: tcp, port: 5432 }
  - from: 10.0.0.25
    type: STORES
    to: corp_data
  - from: 10.0.0.35
    type: STORES
    to: corp_data
credentials:
  - id: admin_creds
    owner: 10.0.0.5
    attrs: { strength: weak, mfa: false }
data:
  - id: corp_data
    store: 10.0.0.35
    attrs: { kind: pii, sensitivity: high }
