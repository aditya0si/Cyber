id: api.finbank
assets:
  - id: api1
    type: api_server
    label: "API Gateway"
    attrs: { framework: fastapi, host: 10.1.1.10 }
  - id: auth_svc
    type: auth_service
    label: "Auth Service"
    attrs: { framework: flask, host: 10.1.1.11 }
  - id: orders_db
    type: database
    label: "Orders Database"
    attrs: { engine: postgres, host: 10.1.1.12 }
services:
  - id: orders_api
    asset: api1
    kind: http
    endpoint: /api/orders/{id}
    attrs: { auth_required: true, idor_vulnerable: true }
  - id: auth_login
    asset: auth_svc
    kind: http
    endpoint: /api/auth/login
    attrs: { auth_required: false }
edges:
  - from: api1
    type: READS
    to: orders_db
    attrs: { priv: r }
  - from: api1
    type: AUTHENTICATES_WITH
    to: auth_svc
    attrs: { strength: jwt }
  - from: orders_db
    type: STORES
    to: order_data
credentials:
  - id: api_token
    owner: auth_svc
    attrs: { strength: medium, scope: ["api"] }
data:
  - id: order_data
    store: orders_db
    attrs: { kind: financial, sensitivity: high }
