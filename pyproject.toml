[project]
name = "cybersim"
version = "0.1.0"
description = "CyberSim AI — Autonomous Cybersecurity Simulation & Response Platform"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "CyberSim AI" }]

dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "email-validator>=2.1",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "celery>=5.4",
  "redis>=5.0",
  "networkx>=3.3",
  "structlog>=24.1",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "pyjwt>=2.8",
  "cryptography>=42.0",
  "argon2-cffi>=23.1",
  "webauthn>=2.0",
  "stripe>=9.0",
  "jinja2>=3.1",
  "langgraph>=0.2",
  "openai>=1.30",
  "pgvector>=0.3",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-instrumentation-fastapi>=0.46",
  "opentelemetry-instrumentation-sqlalchemy>=0.46",
  "opentelemetry-instrumentation-redis>=0.46",
  "opentelemetry-instrumentation-httpx>=0.46",
  "opentelemetry-instrumentation-celery>=0.46",
]

[dependency-groups]
dev = [
  "ruff>=0.4",
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-xdist>=3.6",
  "pre-commit>=3.7",
  "types-pyyaml>=6.0",
  "types-redis>=4.6",
  "faker>=25.0",
  "pytest-playwright>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cybersim"]

[tool.pytest.ini_options]
testpaths = ["tests", "cybersim"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = [
  "error::DeprecationWarning:cybersim.*",
]

[tool.taskipy.tasks]
db-up        = "docker compose up -d postgres redis minio"
db-upgrade   = "python -m cybersim.tools.cli db upgrade"
seed         = "python -m cybersim.tools.cli seed --demo"
verify-fast  = "ruff check . && ruff format --check . && mypy cybersim && pytest -q"
verify       = "ruff check . && ruff format --check . && mypy cybersim && pytest -q"
verify-nightly = "ruff check . && ruff format --check . && mypy cybersim && pytest -q -m 'not slow'"
codegen-api  = "python -m cybersim.tools.cli codegen openapi"

[tool.codespell]
skip = "docs/**,*.lock,pnpm-lock.yaml,uv.lock"
